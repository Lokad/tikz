name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Restore locked dependencies
        run: dotnet restore Lokad.TikZ.slnx --locked-mode
      - name: Build Release
        run: dotnet build Lokad.TikZ.slnx -c Release --no-restore
      - name: Test Release
        run: dotnet test Lokad.TikZ.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Check bounded child execution and termination
        run: node tools/TikzVisual/qualification-process-self-test.mjs
      - name: Pack Release
        run: dotnet pack src/Lokad.TikZ/Lokad.TikZ.csproj -c Release --no-build --no-restore
      - name: Verify isolated NuGet consumer and package payload
        shell: pwsh
        run: |
          $packageCheckArgs = @('tools/TikzPackageCheck/verify.mjs', 'artifacts/nuget')
          if ('${{ matrix.os }}' -eq 'windows-latest') { $packageCheckArgs += '--controls' }
          node @packageCheckArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload package checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-checks-${{ matrix.os }}
          path: artifacts/package-check/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/nuget/
          retention-days: 7
          if-no-files-found: error
