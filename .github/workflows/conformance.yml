name: Conformance
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ordinary:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Lokad.TikZ.slnx --locked-mode
      - run: dotnet test Lokad.TikZ.slnx -c Release --no-restore
      - run: dotnet run --project tools/TikzReference -c Release --no-restore -- compare-node-layout
      - run: dotnet pack src/Lokad.TikZ -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tikz-node-layout-${{ matrix.os }}
          path: artifacts/node-layout/
          if-no-files-found: error

  visual:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: tools/TikzVisual/package-lock.json
      - run: npm ci --prefix tools/TikzVisual --ignore-scripts
      - run: npm exec --prefix tools/TikzVisual -- playwright install chromium
      - run: dotnet restore Lokad.TikZ.slnx --locked-mode
      - run: dotnet run --project tools/TikzReference -c Release -- compare --reference cached --out artifacts/comparisons
      - run: dotnet run --project tools/TikzFontData -c Release -- compare
      - run: dotnet run --project tools/TikzFontData -c Release -- compare-text
      - run: dotnet run --project tools/TikzReference -c Release -- compare-node-svg
      - run: npm test --prefix tools/TikzVisual
      - run: npm run test:fonts --prefix tools/TikzVisual
      - run: npm run test:text --prefix tools/TikzVisual
      - run: npm run test:nodes --prefix tools/TikzVisual
      - run: npm run test:interaction-crops --prefix tools/TikzVisual
      - run: npm run test:regions --prefix tools/TikzVisual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tikz-comparisons
          path: |
            artifacts/comparisons/
            artifacts/comparator-mutations/
            artifacts/font-comparisons/
            artifacts/font-comparator-mutations/
            artifacts/text-comparisons/
            artifacts/text-comparator-mutations/
            artifacts/node-comparisons/
            artifacts/node-comparator-mutations/
            artifacts/interaction-crop-mutations/
            artifacts/regional-comparator-mutations/
          if-no-files-found: error
