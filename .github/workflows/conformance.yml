name: Conformance
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ordinary:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: dotnet restore Lokad.TikZ.slnx --locked-mode
      - run: dotnet restore tools/TikzCurvedEdgeComparison --locked-mode
      - run: dotnet restore tools/TikzCurvedEdgeOracle --locked-mode
      - run: dotnet test Lokad.TikZ.slnx -c Release --no-restore
      - run: node tools/TikzVisual/labelled-border-reference.mjs check-cached
      - run: node tools/TikzVisual/labelled-border-evidence-self-test.mjs
      - run: node tools/TikzVisual/edge-reference.mjs check-cached
      - run: node tools/TikzVisual/edge-evidence-self-test.mjs
      - run: node tools/TikzVisual/edge-image-cache-self-test.mjs
      - run: node tools/TikzVisual/edge-admission-self-test.mjs
      - run: node tools/TikzVisual/curved-edge-reference.mjs check-cached
      - run: node tools/TikzVisual/curved-edge-evidence-self-test.mjs
      - run: dotnet run --project tools/TikzCurvedEdgeComparison -c Release --no-restore
      - run: node tools/TikzVisual/curved-edge-frame-self-test.mjs
      - run: node tools/TikzVisual/curved-edge-primary-self-test.mjs
      - run: node tools/TikzVisual/curved-edge-image-cache-self-test.mjs
      - run: node tools/TikzVisual/curved-edge-admission-self-test.mjs
      - run: node tools/TikzVisual/arrow-reference.mjs check-cached
      - run: node tools/TikzVisual/arrow-reference-self-test.mjs
      - run: dotnet run --project tools/TikzCurvedEdgeOracle -c Release --no-restore
      - run: dotnet run --project tools/TikzEdgeComparison -c Release --no-restore
      - run: dotnet run --project tools/TikzEdgeOracle -c Release --no-restore
      - run: node tools/TikzVisual/labelled-border-pdf-diagnostics-self-test.mjs
      - run: dotnet run --project tools/TikzLabelledBorderComparison -c Release --no-restore
      - run: dotnet run --project tools/TikzLabelledBorderOracle -c Release --no-restore
      - run: dotnet run --project tools/TikzShapeReference -c Release --no-restore -- check-cached
      - run: pwsh -NoProfile -File tools/TikzShapeReference/check-cached.ps1
      - run: dotnet run --project tools/TikzShapePdfReference -c Release --no-restore -- check-cached
      - run: dotnet run --project tools/TikzDashReference -c Release --no-restore -- check-cached
      - run: pwsh -NoProfile -File tools/TikzDashReference/check-cached.ps1
      - run: dotnet run --project tools/TikzDashComparison -c Release --no-restore
      - run: dotnet run --project tools/TikzDashGeometryReference -c Release --no-restore -- check-cached
      - run: dotnet run --project tools/TikzDashComparison -c Release --no-restore -- geometry
      - run: pwsh -NoProfile -File tools/TikzShapePdfReference/check-cached.ps1
      - run: dotnet run --project tools/TikzShapeComparison -c Release --no-restore -- compare-numeric
      - run: dotnet run --project tools/TikzShapeCalibration -c Release --no-restore -- derive-svg
      - run: dotnet run --project tools/TikzReference -c Release --no-restore -- compare-node-layout
      - run: dotnet pack src/Lokad.TikZ -c Release --no-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tikz-node-layout-${{ matrix.os }}
          path: |
            artifacts/node-layout/
            artifacts/node-shape-cache-tests/
            artifacts/node-shape-pdf-cache-tests/
            artifacts/node-shape-comparisons/
            artifacts/node-shape-calibration/
            artifacts/dash-comparisons/
            artifacts/dash-cache-controls/
            artifacts/dash-geometry-comparisons/
            artifacts/labelled-border-cache-controls/
            artifacts/labelled-border-numeric/
            artifacts/labelled-border-oracle/
            artifacts/labelled-border-pdf-diagnostic-controls/
            artifacts/edge-reference/
            artifacts/edge-evidence-controls/
            artifacts/edge-image-cache-controls/
            artifacts/edge-admission-controls/
            artifacts/edge-numeric/
            artifacts/edge-oracle/
            artifacts/curved-edge-reference/
            artifacts/curved-edge-evidence-controls/
            artifacts/curved-edge-numeric/
            artifacts/curved-edge-frame-controls/
            artifacts/curved-edge-primary-controls/
            artifacts/curved-edge-image-cache-controls/
            artifacts/curved-edge-admission-controls/
            artifacts/curved-edge-oracle/
            artifacts/arrow-reference/
            artifacts/arrow-native-controls/
          if-no-files-found: error

  visual:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: tools/TikzVisual/package-lock.json
      - run: npm ci --prefix tools/TikzVisual --ignore-scripts
      - run: npm exec --prefix tools/TikzVisual -- playwright install chromium
      - run: dotnet restore Lokad.TikZ.slnx --locked-mode
      - run: dotnet run --project tools/TikzReference -c Release -- compare --reference cached --out artifacts/comparisons
      - run: dotnet run --project tools/TikzFontData -c Release -- compare
      - run: dotnet run --project tools/TikzFontData -c Release -- compare-text
      - run: dotnet run --project tools/TikzReference -c Release -- compare-node-svg
      - run: dotnet run --project tools/TikzReference -c Release -- compare-node-interaction-primary
      - run: dotnet run --project tools/TikzReference -c Release -- compare-node-interaction-pdf
      - run: node tools/TikzVisual/compare-border-conformance.mjs
      - name: Verify fixed curved-connection admission and inspection
        shell: pwsh
        run: |
          node tools/TikzVisual/compare-curved-edge-conformance.mjs | Tee-Object -Variable curvedAdmissionLines
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $curvedMarkers = @($curvedAdmissionLines | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.kind -eq 'curved-edge-conformance' -and $_.final })
          if ($curvedMarkers.Count -ne 1 -or -not $curvedMarkers[0].completed -or -not $curvedMarkers[0].passed) { throw 'Curved admission is incomplete.' }
          $curvedReport = $curvedMarkers[0].report
          if ((Get-FileHash -LiteralPath $curvedReport -Algorithm SHA256).Hash.ToLowerInvariant() -ne $curvedMarkers[0].sha256) { throw 'Curved report changed.' }
          node tools/TikzVisual/curved-edge-admission-self-test.mjs --report $curvedReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/TikzVisual/curved-edge-agent-self-test.mjs --report $curvedReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/edge-candidate-inspect.mjs
      - run: node tools/TikzVisual/edge-oracle-self-test.mjs
      - run: node tools/TikzVisual/inspect-edge-oracle.mjs
      - name: Verify independent edge reference images
        shell: pwsh
        run: |
          $edgeOracleRun = Get-Content artifacts/edge-oracle-inspection/latest.json -Raw | ConvertFrom-Json
          if (-not $edgeOracleRun.completed) { throw 'Independent edge inspection is incomplete.' }
          node tools/TikzVisual/check-edge-oracle.mjs ('artifacts/edge-oracle-inspection/' + $edgeOracleRun.report)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/edge-operation-self-test.mjs
      - run: node tools/TikzVisual/inspect-edge-operations.mjs
      - name: Verify native edge operation observations
        shell: pwsh
        run: |
          $edgeOperationRun = Get-Content artifacts/edge-operation-inspection/latest.json -Raw | ConvertFrom-Json
          if (-not $edgeOperationRun.completed) { throw 'Native operation inspection is incomplete.' }
          node tools/TikzVisual/check-edge-operations.mjs ('artifacts/edge-operation-inspection/' + $edgeOperationRun.report)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/edge-primary-self-test.mjs
      - run: node tools/TikzVisual/calibrate-edge-primary.mjs
      - name: Verify native edge primary calibration
        shell: pwsh
        run: |
          $edgePrimaryRun = Get-Content artifacts/edge-primary-calibration/latest.json -Raw | ConvertFrom-Json
          if (-not $edgePrimaryRun.completed) { throw 'Native primary calibration is incomplete.' }
          node tools/TikzVisual/check-edge-primary.mjs ('artifacts/edge-primary-calibration/' + $edgePrimaryRun.report)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/edge-pdf-self-test.mjs
      - run: node tools/TikzVisual/calibrate-edge-pdf.mjs
      - name: Verify native edge PDF qualification
        shell: pwsh
        run: |
          $edgePdfRun = Get-Content artifacts/edge-pdf-calibration/latest.json -Raw | ConvertFrom-Json
          if (-not $edgePdfRun.completed) { throw 'Native PDF calibration is incomplete.' }
          node tools/TikzVisual/check-edge-pdf.mjs ('artifacts/edge-pdf-calibration/' + $edgePdfRun.report)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/edge-trial-self-test.mjs
      - name: Trial public straight-edge image gates
        shell: pwsh
        run: |
          $edgePrimary = Get-Content artifacts/edge-primary-calibration/latest.json -Raw | ConvertFrom-Json
          $edgePrimaryCheck = Get-Content artifacts/edge-primary-checks/latest.json -Raw | ConvertFrom-Json
          $edgePdf = Get-Content artifacts/edge-pdf-calibration/latest.json -Raw | ConvertFrom-Json
          $edgePdfCheck = Get-Content artifacts/edge-pdf-checks/latest.json -Raw | ConvertFrom-Json
          if (@($edgePrimary, $edgePrimaryCheck, $edgePdf, $edgePdfCheck).Where({ -not $_.completed }).Count) { throw 'Edge qualification is incomplete.' }
          $edgeTrialInputs = @(
            ('artifacts/edge-primary-calibration/' + $edgePrimary.report)
            ('artifacts/edge-primary-checks/' + $edgePrimaryCheck.report)
            ('artifacts/edge-pdf-calibration/' + $edgePdf.report)
            ('artifacts/edge-pdf-checks/' + $edgePdfCheck.report)
          )
          node tools/TikzVisual/trial-edge-images.mjs @edgeTrialInputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $edgeTrial = Get-Content artifacts/edge-public-trial/latest.json -Raw | ConvertFrom-Json
          if (-not $edgeTrial.completed) { throw 'Public edge trial is incomplete.' }
          node tools/TikzVisual/check-edge-trial.mjs ('artifacts/edge-public-trial/' + $edgeTrial.report)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/TikzVisual/inspect-shapes.mjs
      - run: node tools/TikzVisual/calibrate-shapes.mjs
      - run: node tools/TikzVisual/shape-frame-self-test.mjs
      - run: node tools/TikzVisual/shape-raster-self-test.mjs
      - run: node tools/TikzVisual/shape-policy-self-test.mjs
      - run: node tools/TikzVisual/shape-pdf-policy-self-test.mjs
      - run: node tools/TikzVisual/trial-shape-primary.mjs
      - run: node tools/TikzVisual/calibrate-shape-pdf.mjs
      - run: node tools/TikzVisual/compare-curved-node-conformance.mjs
      - run: node tools/TikzVisual/curved-node-admission-self-test.mjs
      - run: node tools/TikzVisual/inspect-labelled-borders.mjs
      - run: node tools/TikzVisual/labelled-border-inspection-self-test.mjs
      - run: node tools/TikzVisual/inspect-labelled-border-oracle.mjs
      - run: node tools/TikzVisual/labelled-border-oracle-self-test.mjs
      - run: node tools/TikzVisual/labelled-border-ink-self-test.mjs
      - run: node tools/TikzVisual/calibrate-labelled-border-ink.mjs
      - run: node tools/TikzVisual/trial-labelled-border-primary.mjs
      - run: node tools/TikzVisual/check-labelled-border-sensitivity.mjs
      - run: node tools/TikzVisual/check-labelled-border-sensitivity.mjs --public
      - run: node tools/TikzVisual/labelled-border-ink-controls.mjs
      - run: node tools/TikzVisual/labelled-border-cache-self-test.mjs
      - run: node tools/TikzVisual/compare-labelled-border-conformance.mjs
      - run: node tools/TikzVisual/labelled-border-admission-self-test.mjs
      - run: node tools/TikzVisual/inspect-labelled-border-pdf.mjs
      - run: node tools/TikzVisual/labelled-border-pdf-self-test.mjs
      - run: node tools/TikzVisual/trial-dashes.mjs
      - run: node tools/TikzVisual/dash-pdf-vector-self-test.mjs
      - run: node tools/TikzVisual/dash-lines-oracle-self-test.mjs
      - run: node tools/TikzVisual/compare-dash-lines-conformance.mjs
      - run: node tools/TikzVisual/dash-lines-policy-self-test.mjs
      - run: node tools/TikzVisual/inspect-dash-pdf.mjs
      - run: node tools/TikzVisual/dash-geometry-image-self-test.mjs
      - run: dotnet run --project tools/TikzDashComparison -c Release --no-restore -- geometry
      - run: node tools/TikzVisual/inspect-dash-geometry.mjs
      - run: node tools/TikzVisual/trial-dash-path-units.mjs
      - run: node tools/TikzVisual/trial-dash-geometry-primary.mjs
      - run: node tools/TikzVisual/compare-dash-geometry-primary.mjs
      - run: node tools/TikzVisual/dash-geometry-primary-self-test.mjs
      - run: node tools/TikzVisual/dash-geometry-pdf-vector-self-test.mjs
      - run: node tools/TikzVisual/inspect-dash-geometry-pdf.mjs
      - run: node tools/TikzVisual/compare-dash-geometry-conformance.mjs
      - run: node tools/TikzVisual/dash-geometry-pdf-policy-self-test.mjs
      - run: npm test --prefix tools/TikzVisual
      - run: npm run test:fonts --prefix tools/TikzVisual
      - run: npm run test:text --prefix tools/TikzVisual
      - run: npm run test:nodes --prefix tools/TikzVisual
      - run: npm run test:interaction-crops --prefix tools/TikzVisual
      - run: npm run test:regions --prefix tools/TikzVisual
      - run: npm run test:interaction-primary --prefix tools/TikzVisual
      - run: npm run test:pdf-regions --prefix tools/TikzVisual
      - run: node tools/TikzVisual/pdf-viewport-probe.mjs
      - run: npm run test:interaction-pdf --prefix tools/TikzVisual
      - run: npm run test:borders --prefix tools/TikzVisual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tikz-comparisons
          path: |
            artifacts/comparisons/
            artifacts/curved-edge-conformance/
            artifacts/curved-edge-cached-trial/
            artifacts/curved-edge-public-trial/
            artifacts/curved-edge-public-checks/
            artifacts/curved-edge-admission-controls/
            artifacts/curved-edge-agent-controls/
            artifacts/edge-candidate-inspection/
            artifacts/edge-oracle-controls/
            artifacts/edge-oracle-inspection/
            artifacts/edge-oracle-checks/
            artifacts/edge-operation-controls/
            artifacts/edge-operation-inspection/
            artifacts/edge-operation-checks/
            artifacts/edge-primary-controls/
            artifacts/edge-primary-calibration/
            artifacts/edge-primary-checks/
            artifacts/edge-pdf-controls/
            artifacts/edge-pdf-calibration/
            artifacts/edge-pdf-checks/
            artifacts/edge-public-controls/
            artifacts/edge-public-trial/
            artifacts/edge-public-checks/
            artifacts/comparator-mutations/
            artifacts/font-comparisons/
            artifacts/font-comparator-mutations/
            artifacts/text-comparisons/
            artifacts/text-comparator-mutations/
            artifacts/node-comparisons/
            artifacts/node-comparator-mutations/
            artifacts/interaction-crop-mutations/
            artifacts/regional-comparator-mutations/
            artifacts/node-interaction-primary/
            artifacts/interaction-primary-mutations/
            artifacts/pdf-region-self-tests/
            artifacts/pdf-viewport-probe/
            artifacts/node-interaction-pdf/
            artifacts/interaction-pdf-mutations/
            artifacts/border-conformance/
            artifacts/border-policy-tests/
            artifacts/node-shape-comparisons/
            artifacts/labelled-border-inspection/
            artifacts/labelled-border-inspection-controls/
            artifacts/labelled-border-oracle-inspection/
            artifacts/labelled-border-oracle-controls/
            artifacts/labelled-border-ink-math-controls/
            artifacts/labelled-border-ink-calibration/
            artifacts/labelled-border-primary-trial/
            artifacts/labelled-border-oracle-sensitivity/
            artifacts/labelled-border-public-sensitivity/
            artifacts/labelled-border-ink-controls/
            artifacts/labelled-border-cache-controls/
            artifacts/labelled-border-cached-trial/
            artifacts/labelled-border-cached-controls/
            artifacts/labelled-border-conformance/
            artifacts/labelled-border-admission-controls/
            artifacts/labelled-border-pdf/
            artifacts/labelled-border-pdf-controls/
            artifacts/node-shape-calibration/
            artifacts/node-shape-frames/
            artifacts/node-shape-frame-comparisons/
            artifacts/node-shape-semantic-frame/
            artifacts/node-shape-primary-trial/
            artifacts/node-shape-pdf-controls/
            artifacts/node-shape-pdf-calibration/
            artifacts/curved-node-conformance/
            artifacts/curved-node-admission-controls/
            artifacts/dash-image-trial/
            artifacts/dash-pdf-vector/
            artifacts/dash-lines-oracle-controls/
            artifacts/dash-lines-conformance/
            artifacts/dash-lines-policy-controls/
            artifacts/dash-comparisons/
            artifacts/dash-geometry-comparisons/
            artifacts/dash-geometry-images/
            artifacts/dash-path-units/
            artifacts/dash-geometry-primary-trial/
            artifacts/dash-geometry-primary/
            artifacts/dash-geometry-primary-controls/
            artifacts/dash-geometry-pdf-vector-controls/
            artifacts/dash-geometry-pdf/
            artifacts/dash-geometry-conformance/
            artifacts/dash-geometry-pdf-policy-controls/
          if-no-files-found: error
